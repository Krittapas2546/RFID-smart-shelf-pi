<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Status Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1c1c1c;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }
        .main-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }
        .shelf-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .shelf-grid {
            display: grid;
            /* --- Updated for 4x6 grid --- */
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 800px;
            height: 550px; /* Adjusted height for 4 rows */
            border: 2px solid #555;
            padding: 10px;
            background-color: #333;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .shelf-cell {
            background-color: #444;
            border: 1px solid #555;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .shelf-cell span {
            color: #888;
        }
        /* --- Status Colors --- */
        .shelf-cell.available { background-color: #2e7d32; } /* Green */
        .shelf-cell.occupied { background-color: #c62828; } /* Red */
        .shelf-cell.reserved { background-color: #f9a825; } /* Yellow */
        .shelf-cell.error { background-color: #d84315; } /* Deep Orange */
        .shelf-cell.empty { background-color: #444; } /* Default Gray */

        /* --- Highlights --- */
        .shelf-cell.selected-task {
            box-shadow: 0 0 15px 5px #0288d1; /* Blue glow */
            transform: scale(1.05);
            z-index: 10;
        }
        .shelf-cell.highlight-error {
            box-shadow: 0 0 15px 5px #e53935; /* Red glow */
            transform: scale(1.05);
            z-index: 10;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .details-panel, .queue-panel {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .details-panel h3, .queue-panel h3 {
            margin-top: 0;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            color: #0288d1;
        }
        .details-panel div {
            margin-bottom: 12px;
            font-size: 1.1em;
        }
        .details-panel .label {
            color: #aaa;
            display: inline-block;
            width: 100px;
        }
        .details-panel .value {
            font-weight: bold;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            font-size: 0.9em;
        }
        .status-badge.Success { background-color: #2e7d32; }
        .status-badge.Error { background-color: #c62828; }
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .queue-item {
            background-color: #383838;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-item .lot-no {
            font-weight: bold;
        }
        .select-btn {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .select-btn:hover {
            background-color: #0277bd;
        }
        .back-to-queue-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="shelf-container">
            <div class="shelf-grid" id="shelf-grid">
                <!-- Cells will be generated by JavaScript -->
            </div>
        </div>
        <div class="sidebar">
            <div class="details-panel" id="details-panel">
                <h3>Active Job</h3>
                <p>Select a job from the queue to see details.</p>
            </div>
            <div class="queue-panel">
                <h3>Job Queue</h3>
                <ul class="queue-list" id="queue-list">
                    <!-- Queue items will be generated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        const shelfContainer = document.getElementById('shelf-grid');
        const detailsPanel = document.getElementById('details-panel');
        const queueList = document.getElementById('queue-list');

        // --- Mock Data and State Management ---
        // In a real app, this would not be hardcoded
        function initializeMockData() {
            if (!localStorage.getItem('shelfQueue')) {
                const mockQueue = [
                    { lotNo: "LOT-001", from: "Station A", employeeId: "E1234", timestamp: "10:30:15", status: "Success", location: { row: 1, col: 3 } },
                    { lotNo: "LOT-002", from: "Station B", employeeId: "E5678", timestamp: "10:32:45", status: "Success", location: { row: 2, col: 5 } },
                    { lotNo: "LOT-003", from: "Station A", employeeId: "E1234", timestamp: "10:35:20", status: "Error", error: "Item misplaced", location: { row: 4, col: 1 } },
                    { lotNo: "LOT-004", from: "Station C", employeeId: "E9101", timestamp: "10:38:00", status: "Success", location: { row: 3, col: 6 } }
                ];
                localStorage.setItem('shelfQueue', JSON.stringify(mockQueue));
            }
             if (!localStorage.getItem('activeShelfJob')) {
                localStorage.setItem('activeShelfJob', 'null');
             }
        }

        function getQueue() {
            return JSON.parse(localStorage.getItem('shelfQueue')) || [];
        }

        function getActiveJob() {
            const job = localStorage.getItem('activeShelfJob');
            return job ? JSON.parse(job) : null;
        }

        function setActiveJob(job) {
            localStorage.setItem('activeShelfJob', JSON.stringify(job));
            updateUi();
        }

        function goBackToQueue() {
            localStorage.setItem('activeShelfJob', 'null');
            updateUi();
        }

        // --- UI Rendering ---

        function renderShelf(shelfState) {
            const grid = document.querySelector('.shelf-grid');
            if (!grid) return;

            // --- Create 4x6 grid cells if they don't exist ---
            if (grid.children.length === 0) {
                 for (let i = 1; i <= 4; i++) { // 4 rows
                    for (let j = 1; j <= 6; j++) { // 6 columns
                        const cell = document.createElement('div');
                        cell.classList.add('shelf-cell');
                        cell.id = `cell-${i}-${j}`;
                        cell.dataset.row = i;
                        cell.dataset.col = j;
                        cell.innerHTML = `<span>${i}, ${j}</span>`;
                        grid.appendChild(cell);
                    }
                }
            }

            // Reset all cells to default 'empty' state first
            grid.querySelectorAll('.shelf-cell').forEach(cell => {
                cell.className = 'shelf-cell empty';
            });
            
            // Update cells based on the state from the API
            if(shelfState && shelfState.grid) {
                for (const [row, cols] of Object.entries(shelfState.grid)) {
                    for (const [col, status] of Object.entries(cols)) {
                        const cellId = `cell-${row}-${col}`;
                        const cell = document.getElementById(cellId);
                        if (cell && status) {
                            cell.classList.remove('empty');
                            cell.classList.add(status.toLowerCase());
                        }
                    }
                }
            }
        }
        
        function renderQueueList() {
            const queue = getQueue();
            queueList.innerHTML = ''; // Clear existing list
            queue.forEach(job => {
                const item = document.createElement('li');
                item.classList.add('queue-item');
                item.innerHTML = `
                    <span class="lot-no">${job.lotNo}</span>
                    <button class="select-btn">Select</button>
                `;
                item.querySelector('.select-btn').addEventListener('click', () => setActiveJob(job));
                queueList.appendChild(item);
            });
        }

        function renderActiveJobDetails() {
            const activeJob = getActiveJob();
            
            // Clear previous highlights
            document.querySelectorAll('.shelf-cell.selected-task, .shelf-cell.highlight-error').forEach(c => {
                c.classList.remove('selected-task', 'highlight-error');
            });

            if (!activeJob) {
                detailsPanel.innerHTML = `
                    <h3>Active Job</h3>
                    <p>Select a job from the queue to see details.</p>
                `;
                return;
            }
            
            detailsPanel.innerHTML = `
                <h3>Active Job</h3>
                <div><span class="label">Status</span><span class="value"><span class="status-badge ${activeJob.status}">${activeJob.status}</span></span></div>
                <div><span class="label">Lot No.</span><span class="value lot-no">${activeJob.lotNo}</span></div>
                <div><span class="label">From</span><span class="value">${activeJob.from}</span></div>
                <div><span class="label">Employee ID</span><span class="value">${activeJob.employeeId}</span></div>
                <div><span class="label">Timestamp</span><span class="value">${activeJob.timestamp}</span></div>
                ${activeJob.error ? `<div><span class="label" style="color: #e53935;">Error</span><span class="value" style="color: #e53935;">${activeJob.error}</span></div>` : ''}
                <button class="back-to-queue-btn" onclick="goBackToQueue()">← Back to Queue</button>
            `;
            
            if (activeJob.location) {
                const { row, col } = activeJob.location;
                const targetCell = document.getElementById(`cell-${row}-${col}`);
                if (targetCell) {
                    targetCell.classList.add(activeJob.status === 'Error' ? 'highlight-error' : 'selected-task');
                }
            }
        }

        // --- Data Fetching and UI Update Cycle ---
        async function updateUi() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/shelf-state');
                if (!response.ok) throw new Error(`API request failed with status ${response.status}`);
                const shelfState = await response.json();
                
                renderShelf(shelfState);
                renderQueueList();
                renderActiveJobDetails();

            } catch (error) {
                console.error('Failed to update UI:', error);
                detailsPanel.innerHTML = `<h3>Error</h3><p style="color: #e53935;">Could not connect to API. <br>Please ensure the server is running at http://127.0.0.1:8000</p>`;
            }
        }
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeMockData(); // Set up mock data if not present
            updateUi(); // Initial UI render
            setInterval(updateUi, 2500); // Poll for updates every 2.5 seconds
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'shelfQueue' || event.key === 'activeShelfJob') {
                updateUi();
            }
        });

    </script>
</body>
</html>
